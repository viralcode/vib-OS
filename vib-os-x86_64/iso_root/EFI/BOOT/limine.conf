# Limine Configuration File
# VibCode x64

# Timeout before autoboot (seconds)
timeout: 5

# Default boot entry
default_entry: 1

# ==========================================
# VibCode x64
# ==========================================

/Vib-OS
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    module_path: boot():/boot/kernel-installed.elf
    module_string: vibos-install-kernel
    module_path: boot():/EFI/BOOT/BOOTX64.EFI
    module_string: vibos-install-uefi-loader
    module_path: boot():/boot/limine-installed.conf
    module_string: vibos-install-config
